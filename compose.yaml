services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carverse
      POSTGRES_USER: carverse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carverse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carverse -d carverse"]
      interval: 5s
      retries: 10
volumes:
  carverse_postgres:
